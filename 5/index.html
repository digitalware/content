<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨정보</title>

<link rel="stylesheet" href="reset/css/reset.css">
<link rel="stylesheet" href="font/css/font.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/x_style.css">
<link rel="stylesheet" href="../layout/layout.css">

<script src="../storage/storage-manager.js"></script>
<script src="../config/tab-state.js"></script>
<script src="../layout/layout-manager.js"></script>
<script src="../location-loader.js"></script>
</head>
<body data-weather-layout-root>

<header>
    <div class="hbox">
        <h1>율곡고등학교</h1>
        <p id="date-time"></p>
    </div>
</header>

<section id="main" data-weather-layout-area>
    <div class="wrap" data-weather-layout-area>

        <div class="left-box" data-weather-section="mainWeather">

            <div class="weather-top">
                <img id="current-weather-icon" src="images/1.png" alt="날씨">
            </div>

            <div class="weather-text">
                <h2 id="current-weather">Cloudy (흐림)</h2>
                <span>현재날씨</span>
            </div>

            <div class="temp-wrap">
                <strong id="current-temp">19°</strong>

                <div class="temp-minmax">
                    <p id="current-temp-max">↑ 19° ↓ 14°</p>
                </div>
            </div>

        </div>

        <div class="right-box" data-weather-layout-shell data-weather-layout-area>
            <div class="air-box" data-weather-section="airQuality">
                <div class="air-title">
                    <figure id="air-quality-icon-wrap">
                        <img id="air-quality-icon" src="images/good.png" alt="대기질">
                    </figure>
                    <p>AIR QUALITY INDEX</p>
                </div>
                <div class="pm-box">
                    <div>
                        <span class="pm">PM10</span>
                        <strong id="pm10">22</strong>
                    </div>
                    <span id="pm10-grade" class="pm-good">Good</span>

                    <div>
                        <span class="pm">PM2.5</span>
                        <strong id="pm25">8</strong>
                    </div>
                    <span id="pm25-grade" class="pm-good">Good</span>
                </div>
            </div>

            <ul class="detail-box" data-weather-section="weatherCards">

                <li>
                    <img src="images/humidity-icon.png" alt="습도">
                    <strong id="current-humidity">22%</strong>
                    <span>HUMIDITY</span>
                </li>

                <li>
                    <img src="images/wind-icon.png" alt="풍속">
                    <strong id="current-wind">0.97m/s</strong>
                    <span>WIND SPEED</span>
                </li>

                <li>
                    <img src="images/temperatuer-icon.png" alt="체감온도">
                    <strong id="current-temp-feel">18°C</strong>
                    <span>FEELS LIKE</span>
                </li>

                <li>
                    <img src="images/cloud-icon.png" alt="구름량">
                    <strong id="current-clouds">100%</strong>
                    <span>CLOUD</span>
                </li>

            </ul>

        </div>

    </div>
</section>

<section id="forecast" data-weather-section="fiveDayForecast">

    <div class="wrap">

        <ul class="forecast-list">

            <li class="active">
                <p id="forecast1-date">MON</p>
                <img id="forecast1-icon" src="images/1.png" alt="">
                <strong id="forecast1-temp">19°</strong>
                <span id="forecast1-desc"></span>
            </li>

            <li>
                <p id="forecast2-date">TUE</p>
                <img id="forecast2-icon" src="images/2.png" alt="">
                <strong id="forecast2-temp">17°</strong>
                <span id="forecast2-desc"></span>
            </li>

            <li>
                <p id="forecast3-date">WED</p>
                <img id="forecast3-icon" src="images/3.png" alt="">
                <strong id="forecast3-temp">16°</strong>
                <span id="forecast3-desc"></span>
            </li>
            <li>
                <p id="forecast4-date">THU</p>
                <img id="forecast4-icon" src="images/4.png" alt="">
                <strong id="forecast4-temp">15°</strong>
                <span id="forecast4-desc"></span>
            </li>
            <li>
                <p id="forecast5-date">FRI</p>
                <img id="forecast5-icon" src="images/5.png" alt="">
                <strong id="forecast5-temp">14°</strong>
                <span id="forecast5-desc"></span>
            </li>
        </ul>

    </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
