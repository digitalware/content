<script>
const defaultLocation = {
  lat: 37.84799164,
  lon: 126.881304329,
  sido: '경기',
  station: '기흥'
};
let currentLocationData = null;

function safeStorageGetItem(key) {
  try {
    return localStorage.getItem(key);
  } catch (error) {
    console.warn('Storage access blocked:', key, error);
    return null;
  }
}

function safeStorageSetItem(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (error) {
    console.warn('Storage access blocked:', key, error);
  }
}

function safeStorageRemoveItem(key) {
  try {
    localStorage.removeItem(key);
  } catch (error) {
    console.warn('Storage access blocked:', key, error);
  }
}

function normalizeLocationForUrl(locationData) {
  const lat = Number(locationData?.lat);
  const lon = Number(locationData?.lon);
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

  const name = locationData.name || locationData.station || defaultLocation.station || 'SEOUL';

  return {
    lat,
    lon,
    name,
    sido: locationData.sido || defaultLocation.sido,
    station: locationData.station || name
  };
}

function getSavedLocation() {
  const storageKeys = ['weatherLocation', 'weather-location'];

  for (const key of storageKeys) {
    const saved = safeStorageGetItem(key);
    if (!saved) continue;

    try {
      const data = normalizeLocationForUrl(JSON.parse(saved));
      if (data) {
        currentLocationData = data;
        return data;
      }
    } catch (error) {
      safeStorageRemoveItem(key);
      console.warn('Storage parse error:', key, error);
    }
  }

  return currentLocationData;
}

async function resolveLocationName(name) {
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=ko&format=json`);
    const data = await res.json();
    const result = data.results?.[0];
    if (!result) return null;
    return {
      lat: Number(result.latitude),
      lon: Number(result.longitude),
      sido: result.admin1 || defaultLocation.sido,
      station: result.name || name
    };
  } catch (error) {
    return null;
  }
}

function persistLocation(locationData) {
  console.log('=== persistLocation 호출됨 ===');
  console.log('저장할 위치 데이터:', locationData);

  const normalized = normalizeLocationForUrl(locationData);
  if (!normalized) return;
  currentLocationData = normalized;

  safeStorageRemoveItem('weatherData');
  safeStorageRemoveItem('weatherTimestamp');
  safeStorageRemoveItem('airQualityData');
  safeStorageRemoveItem('airQualityTimestamp');
  safeStorageSetItem('weatherLocation', JSON.stringify(normalized));
  safeStorageSetItem('weather-location', JSON.stringify({
    lat: normalized.lat,
    lon: normalized.lon,
    name: normalized.name
  }));

  console.log('localStorage에 저장됨:', safeStorageGetItem('weatherLocation'));
  updateLocationDisplay();
}

async function applyCurrentInput() {
  const locationName = document.getElementById('location-name').value.trim();
  const latInput = document.getElementById('lat').value.trim();
  const lonInput = document.getElementById('lon').value.trim();
  
  // 위도/경도 둘 다 입력된 경우 (빈 문자열 체크 추가)
  if (latInput && lonInput) {
    const lat = Number(latInput);
    const lon = Number(lonInput);
    
    if (Number.isFinite(lat) && Number.isFinite(lon)) {
      const locationNameForCoord = locationName || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      persistLocation({ 
        lat, 
        lon, 
        sido: locationName || defaultLocation.sido, 
        station: locationNameForCoord 
      });
      updateLocationDisplay();
      return true;
    }
  }

  // 지역명만 입력된 경우
  if (locationName) {
    const resolved = await resolveLocationName(locationName);
    if (resolved) {
      persistLocation(resolved);
      updateLocationDisplay();
      return true;
    } else {
      alert('지역을 찾을 수 없습니다. 위도/경도로 입력해주세요.');
      return false;
    }
  }

  // 아무것도 입력되지 않은 경우
  const saved = getSavedLocation();
  if (saved) {
    return true;
  }

  persistLocation(defaultLocation);
  updateLocationDisplay();
  return true;
}

function prepareWeatherPageInstance() {
  try {
    const tabIdKey = window.WeatherStorageManager?.TAB_ID_SESSION_KEY || 'tabId';
    sessionStorage.removeItem(tabIdKey);
  } catch (error) {
    console.warn('Failed to prepare a new weather page instance:', error);
  }
}

function buildWeatherPageUrl(target, locationData) {
  const normalized = normalizeLocationForUrl(locationData) || normalizeLocationForUrl(defaultLocation);
  const separator = target.includes('?') ? '&' : '?';
  const params = new URLSearchParams({
    lat: String(normalized.lat),
    lon: String(normalized.lon),
    name: normalized.name
  });

  if (normalized.sido) params.set('sido', normalized.sido);
  if (normalized.station) params.set('station', normalized.station);

  return `${target}${separator}${params.toString()}`;
}

async function goToPage(target) {
  const applied = await applyCurrentInput();
  if (!applied) return;

  const locationData = currentLocationData || getSavedLocation() || defaultLocation;
  prepareWeatherPageInstance();
  window.location.href = buildWeatherPageUrl(target, locationData);
}

const pageLinks = document.querySelectorAll('main a[href$="index.html"]');
pageLinks.forEach((link) => {
  link.addEventListener('click', (event) => {
    event.preventDefault();
    goToPage(link.getAttribute('href'));
  });
});

function updateLocationDisplay() {
  const saved = getSavedLocation();
  const displayEl = document.getElementById('location-display');
  if (displayEl) {
    if (saved) {
      displayEl.textContent = `현재 저장된 위치: ${saved.station} (${saved.lat.toFixed(4)}, ${saved.lon.toFixed(4)})`;
    } else {
      displayEl.textContent = '저장된 위치 없음 (기본값 사용)';
    }
  }
}

document.getElementById('apply-location').addEventListener('click', async () => {
  console.log('=== 위치 적용 버튼 클릭됨 ===');
  const result = await applyCurrentInput();
  console.log('applyCurrentInput 결과:', result);
  if (result) {
    // 플래그 설정: 모든 탭의 sessionStorage를 초기화하라는 신호
    try {
      sessionStorage.setItem('forceLocationUpdate', 'true');
    } catch (error) {
      console.warn('Storage access blocked:', error);
    }
    alert('위치가 저장되었습니다!');
  } else {
    alert('위치 저장에 실패했습니다. 콘솔을 확인해주세요.');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  updateLocationDisplay();
});

var map = L.map('map').setView([37.5665, 126.9780], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
</script>
